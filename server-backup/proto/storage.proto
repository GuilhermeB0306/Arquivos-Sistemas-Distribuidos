syntax = "proto3";

package storage;

// Serviço gRPC exposto pelos Servidores Centrais e pelo Servidor de Backup
service FileService {
  rpc ComputeChunkHash (ChunkHashRequest) returns (ChunkHashResponse);
  rpc SaveChunk (ChunkUploadRequest) returns (ChunkUploadResponse);
  rpc ReplicateChunk (ChunkReplicationRequest) returns (ChunkReplicationResponse);
  rpc GetChunk (ChunkDownloadRequest) returns (ChunkDownloadResponse);
  rpc GetFileMap (FileMapRequest) returns (FileMapResponse);
  rpc ListFiles (Empty) returns (FileListResponse);
}

message Empty {}

message ChunkHashRequest {
  int32 part_number = 1;
  string chunk_filename = 2;
  bytes content = 3;
}

message ChunkHashResponse {
  int32 part_number = 1;
  string chunk_sha256 = 2;
  string calculated_by_server = 3;
  string worker_thread = 4;
}

message ChunkUploadRequest {
  string original_filename = 1;
  int32 part_number = 2;
  int32 total_parts = 3;
  string chunk_filename = 4;
  bytes content = 5;
  int64 original_size = 6;
  string client_id = 7;
  string chunk_sha256 = 8;
  string combined_file_sha256 = 9;
}

message ChunkUploadResponse {
  bool success = 1;
  bool is_duplicate = 2;
  string duplicate_of_filename = 3;
  string message = 4;
  string handled_by = 5;
  string chunk_path = 6;
  string backup_path = 7;
  bool replicated = 8;
  string chunk_sha256 = 9;
  string combined_file_sha256 = 10;
}

message ChunkReplicationRequest {
  string original_filename = 1;
  int32 part_number = 2;
  int32 total_parts = 3;
  string chunk_filename = 4;
  bytes content = 5;
  string primary_server_id = 6;
}

message ChunkReplicationResponse {
  bool success = 1;
  string backup_server_id = 2;
  string backup_saved_path = 3;
  string message = 4;
}

message ChunkDownloadRequest {
  string chunk_filename = 1;
}

message ChunkDownloadResponse {
  bool found = 1;
  string chunk_filename = 2;
  bytes content = 3;
  string handled_by = 4;
  string message = 5;
}

message FileMapRequest {
  string original_filename = 1;
}

message ChunkLocation {
  int32 part_number = 1;
  string chunk_filename = 2;
  string server_id = 3;
  string server_grpc_address = 4;
  int64 chunk_size = 5;
  string saved_path = 6;
  string backup_server_address = 7;
  string backup_saved_path = 8;
  string chunk_sha256 = 9;
}

message FileMetadata {
  string filename = 1;
  int64 original_size = 2;
  int32 total_parts = 3;
  string uploaded_by = 4;
  string timestamp = 5;
  string combined_file_sha256 = 6;
  repeated ChunkLocation chunks = 7;
}

message FileMapResponse {
  bool found = 1;
  FileMetadata file = 2;
  string handled_by = 3;
}

message FileListResponse {
  repeated FileMetadata files = 1;
  string handled_by = 2;
}
