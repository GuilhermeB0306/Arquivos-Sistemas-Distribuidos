services:
  # =========================================================================
  # CONTAINER 1 (Gateway): Servidor de Borda (REST + JWT Stateless + Sharding + Failover)
  # =========================================================================
  edge-server:
    build:
      context: ./edge-server
      dockerfile: Dockerfile
    container_name: edge-server
    environment:
      - EDGE_ID=edge-server
      - REST_PORT=8080
      - CENTRAL_SERVERS=central-1:50051,central-2:50052
      - BACKUP_SERVER_ADDRESS=server-backup:50053
      - JWT_SECRET_KEY=chave-secreta-sistemas-distribuidos-2026
    ports:
      - "8080:8080"
    depends_on:
      - central-1
      - central-2
      - server-backup
    networks:
      - sd_network

  # =========================================================================
  # CONTAINER 2: Servidor Central 1 (gRPC + Nó 1 do Token Ring + Guarda Parte 1)
  # =========================================================================
  central-1:
    build:
      context: ./central-server
      dockerfile: Dockerfile
    container_name: central-1
    environment:
      - SERVER_ID=central-1
      - GRPC_PORT=50051
      - SELF_GRPC_ADDRESS=central-1:50051
      - NEXT_NODE_ADDRESS=central-2:50052
      - BACKUP_SERVER_ADDRESS=server-backup:50053
      - INITIAL_TOKEN_HOLDER=true
      - TOKEN_HOLD_TIME_SEC=1.5
      - STORAGE_DIR=/app/storage_data
    ports:
      - "50051:50051"
    volumes:
      - ./storage_data:/app/storage_data
    depends_on:
      - server-backup
    networks:
      - sd_network

  # =========================================================================
  # CONTAINER 3: Servidor Central 2 (gRPC + Nó 2 do Token Ring + Guarda Parte 2)
  # =========================================================================
  central-2:
    build:
      context: ./central-server
      dockerfile: Dockerfile
    container_name: central-2
    environment:
      - SERVER_ID=central-2
      - GRPC_PORT=50052
      - SELF_GRPC_ADDRESS=central-2:50052
      - NEXT_NODE_ADDRESS=central-1:50051
      - BACKUP_SERVER_ADDRESS=server-backup:50053
      - INITIAL_TOKEN_HOLDER=false
      - TOKEN_HOLD_TIME_SEC=1.5
      - STORAGE_DIR=/app/storage_data
    ports:
      - "50052:50052"
    volumes:
      - ./storage_data:/app/storage_data
    depends_on:
      - server-backup
    networks:
      - sd_network

  # =========================================================================
  # CONTAINER 4: Servidor de Redundância / Backup (gRPC + Réplica de Parte 1 e 2)
  # =========================================================================
  server-backup:
    build:
      context: ./server-backup
      dockerfile: Dockerfile
    container_name: server-backup
    environment:
      - SERVER_ID=server-backup
      - GRPC_PORT=50053
      - STORAGE_DIR=/app/storage_data
    ports:
      - "50053:50053"
    volumes:
      - ./storage_data:/app/storage_data
    networks:
      - sd_network

networks:
  sd_network:
    driver: bridge
